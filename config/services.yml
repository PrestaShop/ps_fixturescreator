services:
  _defaults:
    public: true

  Faker\Generator:
    factory: ['PrestaShop\Module\PsFixturesCreator\Faker\FakerFactory', 'create']
    arguments:
      - 'en_EN'

  # ---------------------------------------------------------------- Shared helpers

  PrestaShop\Module\PsFixturesCreator\Creator\EntityPicker:
    arguments:
      $connection: '@doctrine.dbal.default_connection'
      $dbPrefix: '%database_prefix%'

  PrestaShop\Module\PsFixturesCreator\Creator\DateSpreader:
    arguments:
      $faker: '@Faker\Generator'

  PrestaShop\Module\PsFixturesCreator\Statistics\RunLogger:
    arguments:
      $connection: '@doctrine.dbal.default_connection'
      $dbPrefix: '%database_prefix%'

  PrestaShop\Module\PsFixturesCreator\Statistics\StatisticsProvider:
    arguments:
      $connection: '@doctrine.dbal.default_connection'
      $dbPrefix: '%database_prefix%'

  PrestaShop\Module\PsFixturesCreator\Preset\PresetRegistry: ~

  # ---------------------------------------------------------------- Creators (low level builders)

  PrestaShop\Module\PsFixturesCreator\Creator\CategoryCreator:
    arguments:
      $faker: '@Faker\Generator'
      $langRepository: '@prestashop.core.admin.lang.repository'
      $entityPicker: '@PrestaShop\Module\PsFixturesCreator\Creator\EntityPicker'

  PrestaShop\Module\PsFixturesCreator\Creator\ManufacturerCreator:
    arguments:
      $faker: '@Faker\Generator'
      $langRepository: '@prestashop.core.admin.lang.repository'
      $entityPicker: '@PrestaShop\Module\PsFixturesCreator\Creator\EntityPicker'

  PrestaShop\Module\PsFixturesCreator\Creator\SupplierCreator:
    arguments:
      $faker: '@Faker\Generator'
      $langRepository: '@prestashop.core.admin.lang.repository'
      $entityPicker: '@PrestaShop\Module\PsFixturesCreator\Creator\EntityPicker'

  PrestaShop\Module\PsFixturesCreator\Creator\CustomerGroupCreator:
    arguments:
      $faker: '@Faker\Generator'
      $langRepository: '@prestashop.core.admin.lang.repository'
      $entityPicker: '@PrestaShop\Module\PsFixturesCreator\Creator\EntityPicker'

  PrestaShop\Module\PsFixturesCreator\Creator\SpecificPriceCreator:
    arguments:
      $faker: '@Faker\Generator'
      $entityPicker: '@PrestaShop\Module\PsFixturesCreator\Creator\EntityPicker'

  PrestaShop\Module\PsFixturesCreator\Creator\TagCreator:
    arguments:
      $faker: '@Faker\Generator'
      $langRepository: '@prestashop.core.admin.lang.repository'
      $entityPicker: '@PrestaShop\Module\PsFixturesCreator\Creator\EntityPicker'

  PrestaShop\Module\PsFixturesCreator\Creator\CustomerCreator:
    arguments:
      $faker: '@Faker\Generator'
      $entityPicker: '@PrestaShop\Module\PsFixturesCreator\Creator\EntityPicker'
      $dateSpreader: '@PrestaShop\Module\PsFixturesCreator\Creator\DateSpreader'

  PrestaShop\Module\PsFixturesCreator\Creator\CartCreator:
    arguments:
      $faker: '@Faker\Generator'
      $entityPicker: '@PrestaShop\Module\PsFixturesCreator\Creator\EntityPicker'
      $customerCreator: '@PrestaShop\Module\PsFixturesCreator\Creator\CustomerCreator'
      $dateSpreader: '@PrestaShop\Module\PsFixturesCreator\Creator\DateSpreader'

  PrestaShop\Module\PsFixturesCreator\Creator\CartRuleCreator:
    arguments:
      $faker: '@Faker\Generator'

  PrestaShop\Module\PsFixturesCreator\Creator\OrderCreator:
    arguments:
      $faker: '@Faker\Generator'
      $customerCreator: '@PrestaShop\Module\PsFixturesCreator\Creator\CustomerCreator'
      $cartCreator: '@PrestaShop\Module\PsFixturesCreator\Creator\CartCreator'
      $entityPicker: '@PrestaShop\Module\PsFixturesCreator\Creator\EntityPicker'
      $dateSpreader: '@PrestaShop\Module\PsFixturesCreator\Creator\DateSpreader'

  PrestaShop\Module\PsFixturesCreator\Creator\CarrierCreator:
    arguments:
      $faker: '@Faker\Generator'

  PrestaShop\Module\PsFixturesCreator\Creator\AttributeCreator:
    arguments:
      $entityManager: '@doctrine.orm.entity_manager'
      $langRepository: '@prestashop.core.admin.lang.repository'
      $shopRepository: '@prestashop.core.admin.shop.repository'

  PrestaShop\Module\PsFixturesCreator\Creator\FeatureCreator:
    arguments:
      $langRepository: '@prestashop.core.admin.lang.repository'

  PrestaShop\Module\PsFixturesCreator\Creator\ProductImageCreator:
    arguments:
      $faker: '@Faker\Generator'
      $imageCopier: '@prestashop.adapter.import.image_copier'

  PrestaShop\Module\PsFixturesCreator\Creator\StockMovementCreator:
    arguments:
      $stockManager: '@prestashop.adapter.stock_manager'
      $stockMvtRepository: '@prestashop.core.api.stock_movement.repository'

  PrestaShop\Module\PsFixturesCreator\Creator\ProductEnricher:
    arguments:
      $faker: '@Faker\Generator'
      $connection: '@doctrine.dbal.default_connection'
      $dbPrefix: '%database_prefix%'
      $entityPicker: '@PrestaShop\Module\PsFixturesCreator\Creator\EntityPicker'
      $tagCreator: '@PrestaShop\Module\PsFixturesCreator\Creator\TagCreator'
      $specificPriceCreator: '@PrestaShop\Module\PsFixturesCreator\Creator\SpecificPriceCreator'
      $dateSpreader: '@PrestaShop\Module\PsFixturesCreator\Creator\DateSpreader'

  PrestaShop\Module\PsFixturesCreator\Creator\ProductCreator:
    arguments:
      $langRepository: '@prestashop.core.admin.lang.repository'
      $featureCreator: '@PrestaShop\Module\PsFixturesCreator\Creator\FeatureCreator'
      $connection: '@doctrine.dbal.default_connection'
      $dbPrefix: '%database_prefix%'
      $faker: '@Faker\Generator'
      $stockMovementCreator: '@PrestaShop\Module\PsFixturesCreator\Creator\StockMovementCreator'
      $productImageCreator: '@PrestaShop\Module\PsFixturesCreator\Creator\ProductImageCreator'
      $productEnricher: '@PrestaShop\Module\PsFixturesCreator\Creator\ProductEnricher'
      $entityPicker: '@PrestaShop\Module\PsFixturesCreator\Creator\EntityPicker'

  PrestaShop\Module\PsFixturesCreator\Creator\ProductCombinationCreator:
    arguments:
      $entityManager: '@doctrine.orm.entity_manager'
      $commandBus: '@prestashop.core.command_bus'
      $attributeCreator: '@PrestaShop\Module\PsFixturesCreator\Creator\AttributeCreator'
      $langRepository: '@prestashop.core.admin.lang.repository'
      $featureCreator: '@PrestaShop\Module\PsFixturesCreator\Creator\FeatureCreator'
      $connection: '@doctrine.dbal.default_connection'
      $dbPrefix: '%database_prefix%'
      $faker: '@Faker\Generator'
      $stockMovementCreator: '@PrestaShop\Module\PsFixturesCreator\Creator\StockMovementCreator'
      $productImageCreator: '@PrestaShop\Module\PsFixturesCreator\Creator\ProductImageCreator'
      $productEnricher: '@PrestaShop\Module\PsFixturesCreator\Creator\ProductEnricher'
      $entityPicker: '@PrestaShop\Module\PsFixturesCreator\Creator\EntityPicker'

  PrestaShop\Module\PsFixturesCreator\Creator\CustomerThreadCreator:
    arguments:
      $langRepository: '@prestashop.core.admin.lang.repository'
      $faker: '@Faker\Generator'
      $entityPicker: '@PrestaShop\Module\PsFixturesCreator\Creator\EntityPicker'
      $dateSpreader: '@PrestaShop\Module\PsFixturesCreator\Creator\DateSpreader'

  PrestaShop\Module\PsFixturesCreator\Creator\CmsCreator:
    arguments:
      $faker: '@Faker\Generator'
      $langRepository: '@prestashop.core.admin.lang.repository'
      $entityPicker: '@PrestaShop\Module\PsFixturesCreator\Creator\EntityPicker'

  PrestaShop\Module\PsFixturesCreator\Creator\StoreCreator:
    arguments:
      $faker: '@Faker\Generator'
      $langRepository: '@prestashop.core.admin.lang.repository'

  PrestaShop\Module\PsFixturesCreator\Creator\EmployeeCreator:
    arguments:
      $faker: '@Faker\Generator'
      $hashing: '@prestashop.core.crypto.hashing'
      $entityPicker: '@PrestaShop\Module\PsFixturesCreator\Creator\EntityPicker'

  PrestaShop\Module\PsFixturesCreator\Creator\TrafficCreator:
    arguments:
      $faker: '@Faker\Generator'
      $connection: '@doctrine.dbal.default_connection'
      $dbPrefix: '%database_prefix%'
      $entityPicker: '@PrestaShop\Module\PsFixturesCreator\Creator\EntityPicker'
      $dateSpreader: '@PrestaShop\Module\PsFixturesCreator\Creator\DateSpreader'

  # ---------------------------------------------------------------- Generators (one per data type)

  PrestaShop\Module\PsFixturesCreator\Generator\CategoryGenerator:
    autowire: true
    tags: ['ps_fixturescreator.generator']
  PrestaShop\Module\PsFixturesCreator\Generator\ManufacturerGenerator:
    autowire: true
    tags: ['ps_fixturescreator.generator']
  PrestaShop\Module\PsFixturesCreator\Generator\SupplierGenerator:
    autowire: true
    tags: ['ps_fixturescreator.generator']
  PrestaShop\Module\PsFixturesCreator\Generator\AttributeGenerator:
    autowire: true
    tags: ['ps_fixturescreator.generator']
  PrestaShop\Module\PsFixturesCreator\Generator\FeatureGenerator:
    autowire: true
    tags: ['ps_fixturescreator.generator']
  PrestaShop\Module\PsFixturesCreator\Generator\ProductGenerator:
    autowire: true
    tags: ['ps_fixturescreator.generator']
  PrestaShop\Module\PsFixturesCreator\Generator\ProductWithCombinationsGenerator:
    autowire: true
    tags: ['ps_fixturescreator.generator']
  PrestaShop\Module\PsFixturesCreator\Generator\SpecificPriceGenerator:
    autowire: true
    tags: ['ps_fixturescreator.generator']
  PrestaShop\Module\PsFixturesCreator\Generator\TagGenerator:
    autowire: true
    tags: ['ps_fixturescreator.generator']
  PrestaShop\Module\PsFixturesCreator\Generator\CustomerGroupGenerator:
    autowire: true
    tags: ['ps_fixturescreator.generator']
  PrestaShop\Module\PsFixturesCreator\Generator\CustomerGenerator:
    autowire: true
    tags: ['ps_fixturescreator.generator']
  PrestaShop\Module\PsFixturesCreator\Generator\CarrierGenerator:
    autowire: true
    tags: ['ps_fixturescreator.generator']
  PrestaShop\Module\PsFixturesCreator\Generator\CartRuleGenerator:
    autowire: true
    tags: ['ps_fixturescreator.generator']
  PrestaShop\Module\PsFixturesCreator\Generator\CartGenerator:
    autowire: true
    tags: ['ps_fixturescreator.generator']
  PrestaShop\Module\PsFixturesCreator\Generator\OrderGenerator:
    autowire: true
    tags: ['ps_fixturescreator.generator']
  PrestaShop\Module\PsFixturesCreator\Generator\CustomerThreadGenerator:
    autowire: true
    tags: ['ps_fixturescreator.generator']
  PrestaShop\Module\PsFixturesCreator\Generator\CmsGenerator:
    autowire: true
    tags: ['ps_fixturescreator.generator']
  PrestaShop\Module\PsFixturesCreator\Generator\StoreGenerator:
    autowire: true
    tags: ['ps_fixturescreator.generator']
  PrestaShop\Module\PsFixturesCreator\Generator\EmployeeGenerator:
    autowire: true
    tags: ['ps_fixturescreator.generator']
  PrestaShop\Module\PsFixturesCreator\Generator\TrafficGenerator:
    autowire: true
    tags: ['ps_fixturescreator.generator']

  PrestaShop\Module\PsFixturesCreator\Generator\GeneratorRegistry:
    arguments:
      $generators: !tagged_iterator ps_fixturescreator.generator

  PrestaShop\Module\PsFixturesCreator\Generator\LegacyContextPreparer:
    arguments:
      $legacyContextLoader: '@prestashop.adapter.legacy_context_loader'

  PrestaShop\Module\PsFixturesCreator\Generator\GenerationRunner:
    arguments:
      $registry: '@PrestaShop\Module\PsFixturesCreator\Generator\GeneratorRegistry'
      $runLogger: '@PrestaShop\Module\PsFixturesCreator\Statistics\RunLogger'
      $contextPreparer: '@PrestaShop\Module\PsFixturesCreator\Generator\LegacyContextPreparer'

  # ---------------------------------------------------------------- Console commands

  PrestaShop\Module\PsFixturesCreator\Command\GenerateCommand:
    autowire: true
    tags:
      - { name: 'console.command' }

  PrestaShop\Module\PsFixturesCreator\Command\ListGeneratorsCommand:
    autowire: true
    tags:
      - { name: 'console.command' }

  PrestaShop\Module\PsFixturesCreator\Command\PresetCommand:
    autowire: true
    tags:
      - { name: 'console.command' }

  PrestaShop\Module\PsFixturesCreator\Command\StatsCommand:
    autowire: true
    tags:
      - { name: 'console.command' }

  # Legacy commands, kept for backward compatibility
  PrestaShop\Module\PsFixturesCreator\Command\ShopCreatorCommand:
    arguments:
      $customerCreator: '@PrestaShop\Module\PsFixturesCreator\Creator\CustomerCreator'
      $cartCreator: '@PrestaShop\Module\PsFixturesCreator\Creator\CartCreator'
      $orderCreator: '@PrestaShop\Module\PsFixturesCreator\Creator\OrderCreator'
      $cartRuleCreator: '@PrestaShop\Module\PsFixturesCreator\Creator\CartRuleCreator'
      $attributeCreator: '@PrestaShop\Module\PsFixturesCreator\Creator\AttributeCreator'
      $featureCreator: '@PrestaShop\Module\PsFixturesCreator\Creator\FeatureCreator'
      $customerThreadCreator: '@PrestaShop\Module\PsFixturesCreator\Creator\CustomerThreadCreator'
      $carrierCreator: '@PrestaShop\Module\PsFixturesCreator\Creator\CarrierCreator'
      $entityPicker: '@PrestaShop\Module\PsFixturesCreator\Creator\EntityPicker'
      $legacyContextLoader: '@prestashop.adapter.legacy_context_loader'
    tags:
      - { name: 'console.command' }

  PrestaShop\Module\PsFixturesCreator\Command\ProductCreatorCommand:
    arguments:
      $productCreator: '@PrestaShop\Module\PsFixturesCreator\Creator\ProductCreator'
      $productCombinationCreator: '@PrestaShop\Module\PsFixturesCreator\Creator\ProductCombinationCreator'
      $legacyContextLoader: '@prestashop.adapter.legacy_context_loader'
    tags:
      - { name: 'console.command' }

  PrestaShop\Module\PsFixturesCreator\Command\CustomerThreadCreatorCommand:
    autowire: true
    tags:
      - { name: 'console.command' }
